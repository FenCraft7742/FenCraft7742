<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Beispiel für die Pixelschrift "Press Start 2P" als Minecraft-Alternative -->
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="javaScript.js" defer></script>
</head>


<body>

<div class="app" id="app" data-sidebar="open">

  <aside class="sidebar" id="sidebar" aria-label="Seitenleiste">
    <div class="sidebar-inner">
      <div class="brand"><img style="width: 30%; height: auto;" src="IMG/OB/SM0.1.Head.png" alt="Menü-Icon">
      </div>
      <nav>
        <ul class="nav">
          <li></li>
        </ul>
      </nav>
      <a class="sidebar-btn" href="P2.html">Zur 2. Seite</a>
      <a class="sidebar-btn" href="Index.html">Zurück zur Startseite</a>
      <button class="sidebar-btn" id="meinButton" type="button" onclick="toggleTheme()">Light/Dark Mode</button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <div class="content">
    <header class="site-header">
      <button class="toggle" id="toggle" type="button"
              aria-controls="sidebar" aria-expanded="true"
              aria-label="Seitenleiste schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <line x1="9" y1="4" x2="9" y2="20"></line>
          <rect class="panel" x="3.8" y="4.8" width="4.4" height="14.4" stroke="none"></rect>
        </svg>
      </button>
      <h1>1. Seite</h1>
    </header>

    <main class="game-main">
      <canvas id="game"></canvas>
    </main>

    <footer class="site-footer">
      <span>FenCraft7742</span>
      <span><img style="width: 40%; height: auto;" src="IMG/OB/SM0.1.Head.png" alt="Menü-Icon"></span>
    </footer>
  </div>

</div>
</body>
</html>
